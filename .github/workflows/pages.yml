# 效果预览上 GitHub Pages：https://wycm9527.github.io/Design-System/morganite/previews/rose-gold-admin/
# 只发布预览和它用相对路径引用的种子文件（dist、bridge 的 CSS），目录层级必须与仓库一致。
# 不用「从分支发布」：.cursor/skills/web-to-design-system 链到单独克隆的 skills/，runner 上是断链，Pages 打包整个仓库会失败。
# 仓库 Settings → Pages 的 Source 要选 GitHub Actions。
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'morganite/previews/**'
      - 'morganite/seeds/morganite/design-system/dist/**'
      - 'morganite/seeds/morganite/bridge/*.css'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 发布效果预览
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}morganite/previews/rose-gold-admin/
    steps:
      - uses: actions/checkout@v4
      - name: 组装站点
        run: |
          S=morganite/seeds/morganite
          mkdir -p _site/morganite "_site/$S/design-system" "_site/$S/bridge"
          cp -R morganite/previews _site/morganite/
          cp -R "$S/design-system/dist" "_site/$S/design-system/"
          cp "$S"/bridge/*.css "_site/$S/bridge/"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
