# 推送 citrine-vX.Y.Z tag 时自动建 GitHub Release：说明来自种子 CHANGELOG 对应段落，附件 = 两个 npm pack 产物 + 纯 CSS 交付包。
# 前置：tag 对应的提交已通过 CI（工作流本身也会先跑 checks 的关键门禁）。
name: Release

on:
  push:
    tags: ['citrine-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 门禁（版本号一致、tag 与种子版本一致）
        run: |
          node citrine/scripts/check-versions.mjs
          V=$(node -p "require('./citrine/seeds/brand-yellow-e/design-system.json').version")
          [ "citrine-v$V" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} 与种子版本 $V 不一致"; exit 1; }
      - name: 建 / 更新 Release（notes + 附件）
        env:
          GH_TOKEN: ${{ github.token }}
        run: node citrine/scripts/release.mjs --version "${GITHUB_REF_NAME#citrine-v}"
