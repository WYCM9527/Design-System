# 推送 <id>-vX.Y.Z tag 时自动建 GitHub Release（任意设计系统，<id> = <id>/seeds/*/design-system.json 里的 id）：
# 说明来自该种子 CHANGELOG 的对应段落，附件 = 种子 npm pack + <id>/tools 的 npm pack（有的话）+ 纯 CSS 交付包 <id>-css-X.Y.Z.tgz。
# 前置：tag 对应的提交已通过 CI（工作流本身也会先跑版本一致性门禁）。
name: Release

on:
  push:
    tags: ['*-v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      id: ${{ steps.parse.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 解析 tag → 系统 id 与版本
        id: parse
        run: |
          ID="${GITHUB_REF_NAME%-v*}"; V="${GITHUB_REF_NAME##*-v}"
          echo "id=$ID" >> "$GITHUB_OUTPUT"; echo "version=$V" >> "$GITHUB_OUTPUT"
          SEED=$(node scripts/systems.mjs --system "$ID") || { echo "::error::tag $GITHUB_REF_NAME 对应的系统 $ID 不存在（<id>/seeds/*/design-system.json）"; exit 1; }
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
      - name: 门禁（该系统六处版本号一致、tag 与种子版本一致）
        run: |
          node scripts/check-versions.mjs --system "${{ steps.parse.outputs.id }}"
          SV=$(node -p "require('./${{ steps.parse.outputs.seed }}/design-system.json').version")
          [ "$SV" = "${{ steps.parse.outputs.version }}" ] || { echo "::error::tag ${GITHUB_REF_NAME} 与种子版本 $SV 不一致"; exit 1; }
      - name: 建 / 更新 Release（notes + 附件）
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs --system "${{ steps.parse.outputs.id }}" --version "${{ steps.parse.outputs.version }}"

  # 同一个 tag 顺带把该系统的包发到 npm registry：种子 + <id>/tools（有的话），但只发 package.json 里带 publishConfig 的（显式选择进 registry；
  # web-to-design-system 提炼出来的种子默认没有 publishConfig，只走文件夹 / Release 直链渠道）。已在 registry 的版本跳过。
  # 认证两选一：npm「Trusted Publishing」（在 npmjs.com 每个包的设置里登记本仓库 + release.yml，靠 OIDC，零密钥，推荐；新包要先登记）；
  # 或仓库 Secret NPM_TOKEN（granular token，勾 publish 与 bypass 2FA）。两者都没配时本 job 会失败，但不影响上面的 GitHub Release。
  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ≥ 11.5.1（Trusted Publishing 需要）
        run: npm install -g npm@latest && npm -v
      - name: 发布到 npm（只发带 publishConfig 的包；已存在的版本跳过）
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc; echo "用 NPM_TOKEN 认证"; else echo "未配 NPM_TOKEN，走 Trusted Publishing（OIDC）"; fi
          DIRS=$(node scripts/systems.mjs --publish-dirs "${{ needs.release.outputs.id }}")
          [ -n "$DIRS" ] || { echo "该系统没有带 publishConfig 的包，跳过 npm 发布（文件夹 / Release 直链渠道已可用）"; exit 0; }
          for d in $DIRS; do
            N=$(node -p "require('./$d/package.json').name"); V=$(node -p "require('./$d/package.json').version")
            if [ -n "$(npm view "$N@$V" version 2>/dev/null)" ]; then echo "$N@$V 已在 registry，跳过"; continue; fi
            if (cd "$d" && npm publish --provenance --access public); then echo "已发布 $N@$V"; else echo "::error::发布 $N@$V 失败（Trusted Publisher 未登记 / 工作流文件名不符 / NPM_TOKEN 无效）"; exit 1; fi
          done
