# CI：改种子 / 桥接 / 工具 / skill 的任何一处，都要过这几道门——
#   checks（单测另在 Windows 上跑一遍）：adopter 单测、迁移角色表与 token 源一致、每个设计系统六处版本号一致、每个种子 dist 与 token 源一致（系统清单来自 scripts/systems.mjs）、调色盘与生成脚本一致并通过体检、效果预览的调色盘文件已重新生成
#   accept：Morganite 三个实测项目各自 npm ci → guard current → status unified → 全量验收（页面 × 亮暗 / 组件走查 / 三端 / 焦点）
#   accept-palettes：Morganite 每个官方颜色（默认颜色由 accept 覆盖）× 三个实测项目：先跟上种子再 ds.mjs palette → guard current → 页面与组件走查（亮 / 暗）
# 验收在无头 Chrome 上跑（runner 自带 google-chrome），CJK 字体装 fonts-noto-cjk（Morganite 沿用 antd 字体栈，中文靠系统回退到 Noto Sans CJK SC）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 单测 · 角色表 · 版本 · 种子 dist · 调色盘
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: steward（治理脚本，公开仓库）
        run: git clone --depth 1 https://github.com/WYCM9527/skills.git skills
      - name: adopter 单测
        run: node --test design-system-adopter/tests/merge.test.mjs design-system-adopter/tests/export.test.mjs design-system-adopter/tests/scope.test.mjs design-system-adopter/tests/ci.test.mjs design-system-adopter/tests/agents.test.mjs design-system-adopter/tests/palette.test.mjs
      - name: 迁移角色表与 token 源一致
        run: node scripts/check-roles.mjs
      - name: 每个设计系统六处版本号一致
        run: node scripts/check-versions.mjs
      - name: 每个种子 dist 与 token 源一致（构建后无 diff）
        run: |
          for SEED in $(node scripts/systems.mjs --seed-dirs); do
            echo "== $SEED"
            (cd "$SEED" && npm i --no-save --no-package-lock --no-audit --no-fund style-dictionary@5.5.2)
            node skills/design-system-steward/scripts/build-tokens.mjs --project "$PWD/$SEED" | tee /tmp/build.json | grep -q '"valid": true'
          done
          git diff --exit-code -- $(node scripts/systems.mjs --dist-paths)
      - name: 调色盘与生成脚本一致（来源钉在固定版本）
        run: node scripts/import-shadcn-palettes.mjs --check
      - name: 调色盘体检（套到种子副本：steward 校验、对比度亮暗、品牌配对、撞色、真构建对照）
        run: node scripts/check-palettes.mjs --build
      - name: 效果预览的调色盘覆盖与面板数据已重新生成
        run: node scripts/build-palette-preview.mjs --check

  checks-windows:
    name: Windows · adopter 单测 · 角色表 · 版本
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: adopter 单测（路径分隔符 / 复制 / 三方合并 / 换色在 Windows 上的行为）
        run: node --test design-system-adopter/tests/merge.test.mjs design-system-adopter/tests/export.test.mjs design-system-adopter/tests/scope.test.mjs design-system-adopter/tests/ci.test.mjs design-system-adopter/tests/agents.test.mjs design-system-adopter/tests/palette.test.mjs
      - name: 迁移角色表与 token 源一致
        run: node scripts/check-roles.mjs
      - name: 每个设计系统六处版本号一致
        run: node scripts/check-versions.mjs

  accept:
    name: 验收 · ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: Morganite · mall-ops, id: morganite-mall-ops, app: morganite/testbed/mall-ops/app }
          - { project: Morganite · element-lab, id: morganite-element-lab, app: morganite/testbed/element-lab/app }
          - { project: Morganite · shadcn-lab, id: morganite-shadcn-lab, app: morganite/testbed/shadcn-lab/app }
    env:
      CHROME_FLAGS: --no-sandbox --disable-dev-shm-usage --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CJK 字体（字体栈的 Noto Sans CJK SC，否则中文测宽失真）
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk >/dev/null && fc-list | grep -c "Noto Sans CJK" | xargs echo "Noto CJK faces:"
      - name: steward（guard / status）
        run: git clone --depth 1 https://github.com/WYCM9527/skills.git skills
      - name: "依赖（file: 链接到种子与工具）"
        working-directory: ${{ matrix.app }}
        run: npm ci --no-audit --no-fund
      - name: guard current · status unified
        run: |
          APP="$PWD/${{ matrix.app }}"
          node skills/design-system-steward/scripts/guard.mjs --project "$APP" | tee /tmp/guard.json | grep -q '"status": "current"'
          node skills/design-system-steward/scripts/status.mjs --project "$APP" | tee /tmp/status.json | grep -q '"status": "unified"'
      - name: 全量验收
        working-directory: ${{ matrix.app }}
        run: npm run accept
      - name: 失败留证（截图与报告）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accept-${{ matrix.id }}
          path: ${{ matrix.app }}/.accept
          retention-days: 7

  palette-list:
    name: 官方颜色清单
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "list=$(node -p "const p = require('./morganite/seeds/morganite/design-system.json').palettes; JSON.stringify(p.official.filter((id) => id !== p.default.id))")" | tee -a "$GITHUB_OUTPUT"

  accept-palettes:
    name: 换色验收 · ${{ matrix.palette }} · ${{ matrix.project }}
    needs: palette-list
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        palette: ${{ fromJSON(needs.palette-list.outputs.list) }}
        project: [mall-ops, element-lab, shadcn-lab]
    env:
      CHROME_FLAGS: --no-sandbox --disable-dev-shm-usage --disable-gpu
      APP: morganite/testbed/${{ matrix.project }}/app
      DESIGN_SYSTEM_STEWARD: ${{ github.workspace }}/skills/design-system-steward
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CJK 字体（字体栈的 Noto Sans CJK SC，否则中文测宽失真）
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk >/dev/null
      - name: steward（换色后重建 token、guard）
        run: git clone --depth 1 https://github.com/WYCM9527/skills.git skills
      - name: "依赖（file: 链接到种子与工具）"
        working-directory: ${{ env.APP }}
        run: npm ci --no-audit --no-fund
      - name: 换色（示例项目先跟上种子，再 ds.mjs palette）· guard current
        run: |
          node design-system-adopter/scripts/ds.mjs upgrade --from morganite/seeds/morganite --project "$APP"
          node design-system-adopter/scripts/ds.mjs palette ${{ matrix.palette }} --project "$APP"
          node skills/design-system-steward/scripts/guard.mjs --project "$PWD/$APP" | tee /tmp/guard.json | grep -q '"status": "current"'
      - name: 页面与组件走查（亮 / 暗）
        working-directory: ${{ env.APP }}
        run: |
          npm run build
          set +e
          npx citrine-accept pages; pages=$?
          npx citrine-accept components; components=$?
          exit $(( pages || components ))
      - name: 失败留证（截图与报告）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accept-palette-${{ matrix.palette }}-${{ matrix.project }}
          path: ${{ env.APP }}/.accept
          retention-days: 7
