<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citrine × shadcn/ui 实验室</title>
    <script>
      // Theme 激活方式来自 design-system/theme-map.json：<html> 上的 class dark。首屏前读 URL 与 localStorage，避免闪烁；验收工具靠 ?theme=dark 直达。
      (function () {
        var q = new URLSearchParams(location.search);
        var theme = q.get('theme') || localStorage.getItem('sl-theme');
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
