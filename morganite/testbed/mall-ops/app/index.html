<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拾光商城 · 运营后台</title>
    <!-- 另一模式按 design-system/theme-map.json：<html class="dark">。首屏先读 ?theme=，再读本地记忆，避免闪烁 -->
    <script>(function () { var q = new URLSearchParams(location.search).get("theme"), t = q; try { if (q) localStorage.setItem("mall-ops-theme", q); else t = localStorage.getItem("mall-ops-theme"); } catch (e) {} if (t === "dark") document.documentElement.classList.add("dark"); })();</script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
